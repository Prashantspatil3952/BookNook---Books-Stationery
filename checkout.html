<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout - BookNook</title><link rel="stylesheet" href="css/style.css"></head><body><header><div class="container nav"><a class="logo" href="index.html">Book<span>Nook</span></a><nav class="navlinks"><a href="products.html">Books</a><a href="cart.html">Cart</a></nav></div></header><main class="container"><div class="page-title"><div class="eyebrow">Almost there</div><h1>Checkout</h1></div><div class="two"><form class="form" id="order-form"><h2>Delivery details</h2><label>Full name</label><input required placeholder="Your name"><label>Email</label><input required type="email" placeholder="you@example.com"><label>Address</label><textarea required placeholder="House number, street, city"></textarea><div class="two"><div><label>Delivery date</label><input required type="date"></div><div><label>Payment</label><select required><option>Cash on Delivery</option><option>Card</option><option>UPI</option></select></div></div><button class="btn" type="submit">Place Order</button></form><div class="form" id="checkout-summary"><h3>Order Summary</h3></div></div></main><script src="js/app.js"></script></body></html>
